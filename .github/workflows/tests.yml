name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project pins a uv range in pyproject.toml, so mirror it here.
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.11.2,<0.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q
